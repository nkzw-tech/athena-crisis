packages:
  - apollo
  - ares
  - art
  - artemis
  - athena
  - codegen
  - deimos
  - dionysus
  - docs
  - eslint-plugin
  - fixtures
  - hera
  - hermes
  - i18n
  - offline
  - scripts
  - tests
  - ui
  - zeus

allowBuilds:
  '@firebase/util': false
  '@playwright/browser-chromium': true
  '@prisma/engines': true
  '@sentry/cli': true
  '@swc/core': true
  bufferutil: true
  canvas: false
  es5-ext: false
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  vue-demi: false
  workerd: true

minimumReleaseAgeExclude:
  - '@nkzw/*'
  - fbtee@3.1.0
  - '@prisma/client-runtime-utils@7.10.0'
  - '@prisma/client@7.10.0'
  - '@prisma/config@7.10.0'
  - '@prisma/debug@7.10.0'
  - '@prisma/engines@7.10.0'
  - '@prisma/fetch-engine@7.10.0'
  - '@prisma/get-platform@7.10.0'
  - prisma@7.10.0

overrides:
  react@^18.0.0: 19.0.0-rc.1
  rollup@^2.0.0: ^4.16.4

patchedDependencies:
  cordova-plugin-purchase: patches/cordova-plugin-purchase.patch
  howler: patches/howler.patch
  require-in-the-middle: patches/require-in-the-middle.patch

peerDependencyRules:
  allowAny:
    - '@aws-sdk/client-sso-oidc'
    - react
    - react-dom
    - utf-8-validate
